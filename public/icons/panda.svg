<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 196" role="img" aria-label="Panda waving">
  <g fill="#231f20">
    <!-- legs -->
    <rect x="58" y="156" width="8" height="26" rx="4" transform="rotate(-3 62 169)"/>
    <rect x="140" y="156" width="8" height="26" rx="4" transform="rotate(3 144 169)"/>
    <!-- body and raised arm, overlapping so they read as one mass -->
    <rect x="40" y="122" width="140" height="48" rx="22" transform="rotate(-3 110 146)"/>
    <rect x="128" y="60" width="52" height="106" rx="26"/>
  </g>

  <!-- the waving paw -->
  <g fill="#ffffff">
    <ellipse cx="154" cy="92" rx="9" ry="7.5"/>
    <circle cx="143" cy="79" r="4"/>
    <circle cx="154" cy="75" r="4.2"/>
    <circle cx="165" cy="79" r="4"/>
  </g>

  <!-- ears sit behind the head -->
  <g fill="#231f20">
    <circle cx="44" cy="56" r="17"/>
    <circle cx="118" cy="38" r="17"/>
  </g>

  <!-- head -->
  <circle cx="83" cy="88" r="52" fill="#ffffff" stroke="#231f20" stroke-width="7"/>

  <!-- eye patches -->
  <ellipse cx="61" cy="82" rx="15" ry="19" fill="#231f20" transform="rotate(-22 61 82)"/>
  <ellipse cx="106" cy="76" rx="15" ry="19" fill="#231f20" transform="rotate(18 106 76)"/>

  <!-- eyes -->
  <circle cx="63" cy="86" r="9" fill="#ffffff"/>
  <circle cx="107" cy="80" r="9" fill="#ffffff"/>
  <circle cx="64" cy="87" r="6.4" fill="#231f20"/>
  <circle cx="108" cy="81" r="6.4" fill="#231f20"/>
  <circle cx="66.5" cy="84" r="2.4" fill="#ffffff"/>
  <circle cx="110.5" cy="78" r="2.4" fill="#ffffff"/>

  <!-- nose and mouth -->
  <ellipse cx="84" cy="102" rx="8" ry="5.6" fill="#231f20"/>
  <path d="M84 108 q -1 7 -5 9 q 5 3 10 0 q -4 -2 -5 -9 z" fill="#231f20"/>
</svg>
